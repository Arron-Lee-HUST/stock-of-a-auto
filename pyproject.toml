[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-of-a-auto"
version = "0.1.0"
description = "Configurable A-share short-term strategy engine based on the Three Drives, One Move model"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stock-auto = "stock_auto.cli:main"

[project.optional-dependencies]
tushare = ["tushare>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
