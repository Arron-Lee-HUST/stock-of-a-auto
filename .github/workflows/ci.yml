name: Python CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m compileall -q src tests
          python -m pip install --no-deps .
          stock-auto --help
          docker build -t stock-of-a-auto:ci .
          PYTHONPATH=src python -m stock_auto --help
          python examples/generate_demo_data.py
          PYTHONPATH=src python -m stock_auto validate-data --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-12-31 --output /tmp/data-quality.json
          PYTHONPATH=src python -m stock_auto scan --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-02-12 --trade-date 2024-02-12 --auction-csv examples/data/auction.csv --intraday-csv examples/data/intraday.csv --flow-csv examples/data/flow.csv --sector-csv examples/data/sector.csv --output-dir /tmp/scan-report
          PYTHONPATH=src python -m stock_auto monitor --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-02-12 --signal-date 2024-02-09 --trade-date 2024-02-12 --checked-at 09:23:00 --auction-csv examples/data/auction.csv --intraday-csv examples/data/intraday.csv --flow-csv examples/data/flow.csv --sector-csv examples/data/sector.csv --market-stats-json examples/data/market-stats.json --output /tmp/monitor.json
          PYTHONPATH=src python -m stock_auto backtest --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-02-12 --auction-csv examples/data/auction.csv --intraday-csv examples/data/intraday.csv --flow-csv examples/data/flow.csv --sector-csv examples/data/sector.csv --output-dir /tmp/backtest-report
          PYTHONPATH=src python -m stock_auto paper-replay --daily-csv examples/data/daily.csv --orders-csv examples/data/paper-orders.csv --output /tmp/paper-account.json
