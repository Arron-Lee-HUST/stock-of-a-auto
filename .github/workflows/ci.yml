name: Python CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m compileall -q src tests
          PYTHONPATH=src python -m stock_auto --help\n          python examples/generate_demo_data.py\n          PYTHONPATH=src python -m stock_auto validate-data --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-12-31 --output /tmp/data-quality.json\n          PYTHONPATH=src python -m stock_auto scan --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-02-12 --trade-date 2024-02-12 --auction-csv examples/data/auction.csv --intraday-csv examples/data/intraday.csv --flow-csv examples/data/flow.csv --sector-csv examples/data/sector.csv --output-dir /tmp/scan-report\n          PYTHONPATH=src python -m stock_auto backtest --daily-csv examples/data/daily.csv --universe-csv examples/data/universe.csv --start-date 2024-01-01 --end-date 2024-02-12 --auction-csv examples/data/auction.csv --intraday-csv examples/data/intraday.csv --flow-csv examples/data/flow.csv --sector-csv examples/data/sector.csv --output-dir /tmp/backtest-report\n          PYTHONPATH=src python -m stock_auto paper-replay --daily-csv examples/data/daily.csv --orders-csv examples/data/paper-orders.csv --output /tmp/paper-account.json
